<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Cuisine</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <!-- Lecteur Lottie -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dotlottie-player/2.7.12/dotlottie-player.mjs" type="module"></script>

  <style>
    :root {
      --bg: #fbf9f4;
      --card-bg: #ffffff;
      --text-main: #232220;
      --text-muted: #82807a;
      --accent: #1c1b18;
      --accent-soft: #f2efe9;
      --border: rgba(0, 0, 0, 0.05);
      --shadow-sm: 0 2px 8px rgba(35, 34, 32, 0.04);
      --shadow-md: 0 10px 30px rgba(35, 34, 32, 0.06);
      --radius-lg: 24px;
      --radius-md: 18px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif; 
      margin: 0; 
      padding: max(20px, env(safe-area-inset-top)) 20px max(40px, env(safe-area-inset-bottom)); 
      background: var(--bg); 
      color: var(--text-main); 
      -webkit-font-smoothing: antialiased;
    }

    /* Typo & Titres */
    h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.8px; margin: 0 0 24px; }
    h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin: 0 0 16px; }
    h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; color: var(--text-muted); margin: 32px 0 16px; }

    /* Entrées & Boutons */
    .search-box {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 8px 8px 8px 18px;
      display: flex;
      align-items: center;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      gap: 10px;
    }
    input[type="text"] {
      border: none;
      outline: none;
      background: transparent;
      font-size: 17px;
      color: var(--text-main);
      flex: 1;
    }
    .stepper {
      display: flex;
      align-items: center;
      background: var(--accent-soft);
      border-radius: 30px;
      padding: 4px 10px;
      font-weight: 600;
      font-size: 14px;
    }
    .stepper input {
      border: none;
      background: transparent;
      width: 32px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      outline: none;
    }
    .btn-action {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn-action:active { transform: scale(0.97); opacity: 0.9; }

    /* Liste des résultats de recherche */
    .result-card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .result-card:active { transform: scale(0.98); }
    .result-title { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; margin-bottom: 6px; }
    .meta-tag { font-size: 13px; color: var(--text-muted); font-weight: 500; }

    /* Fiche Recette Header */
    .recipe-header { margin-bottom: 24px; }
    .recipe-title { font-size: 28px; font-weight: 700; letter-spacing: -0.6px; margin: 12px 0 6px; line-height: 1.2; }
    .recipe-sub { font-size: 14px; color: var(--text-muted); font-weight: 500; }

    /* Grille des Ingrédients épurée */
    .ingredients-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 12px;
    }
    .ingredient-card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 18px 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }
    .ingredient-icon {
      width: 44px;
      height: 44px;
      object-fit: contain;
      margin-bottom: 10px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04));
    }
    .ingredient-text {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-main);
      word-break: break-word;
    }

    /* Cartes des Étapes */
    .step-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }
    .step-index {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .step-text {
      font-size: 17px;
      line-height: 1.5;
      font-weight: 400;
      color: var(--text-main);
    }
    .step-media {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 16px 0 10px;
    }
    .step-sprites {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--accent-soft);
    }
    .step-sprite-icon {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .btn-back {
      background: none;
      border: none;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <!-- VUE 1 : RECHERCHE -->
  <div id="searchView">
    <h1>Cuisine</h1>
    
    <div class="search-box">
      <input type="text" id="queryInput" placeholder="Tarte poireaux, gâteau..." autocomplete="off">
      <div class="stepper">
        <span style="color: var(--text-muted); font-size: 12px;">Pers.</span>
        <input type="number" id="nbPersonnes" value="2" min="1" max="20">
      </div>
      <button onclick="chercherRecettes()" class="btn-action">Go</button>
    </div>

    <div id="searchResults" style="margin-top: 32px;"></div>
  </div>

  <!-- VUE 2 : FICHE RECETTE -->
  <div id="recipeView" style="display: none;">
    <button onclick="retourRecherche()" class="btn-back">← Retour</button>
    <div id="recipeContent"></div>
  </div>

  <script>
    // Mapping des assets
    const ASSETS = {
      ingredients: {
        "chocolat": "chocolat.png",
        "beurre": "beurre.png",
        "oeuf": "oeuf.png",
        "œuf": "oeuf.png",
        "œufs": "oeuf.png",
        "oeufs": "oeuf.png",
        "sucre": "sucre.png",
        "ail": "ail.png",
        "amande": "amande.png",
        "aubergine": "aubergine.png",
        "banane": "banane.png",
        "citron": "citron.png",
        "citrouille": "citrouille.png",
        "eau": "eau.png",
        "farine": "farine.png",
        "fraise": "fraise.png",
        "raisin": "grain-de-raisin.png",
        "huile": "huile-olive.png",
        "kiwi": "kiwi.png",
        "lait": "lait.png",
        "oignon": "oignon.png",
        "orange": "orange.png",
        "pasteque": "pasteque.png",
        "poireau": "poireau.png",
        "pomme": "pomme.png"
      },
      actions: {
        "couper": "découper.json",
        "émincer": "découper.json",
        "hacher": "découper.json",
        "peler": "découper.json",
        "découper": "découper.json",
        "cuire": "poele.json",
        "revenir": "poele.json",
        "dorer": "poele.json",
        "poêler": "poele.json",
        "fondre": "poele.json",
        "chauffer": "poele.json",
        "mélanger": "touillage.json",
        "remuer": "touillage.json",
        "fouetter": "touillage.json",
        "incorporer": "touillage.json",
        "battre": "touillage.json"
      }
    };

    // Détection stricte d'un mot pour éviter les faux positifs (ex: "eau" dans "plateau")
    function matchIngredientStrict(textLower, key) {
      if (key === "eau") {
        return /\b(eau|l'eau|d'eau)\b/i.test(textLower);
      }
      if (key === "lait") {
        return /\b(lait)\b/i.test(textLower);
      }
      return textLower.includes(key);
    }

    async function chercherRecettes() {
      const q = document.getElementById("queryInput").value.trim();
      const resultsDiv = document.getElementById("searchResults");
      if (!q) return;

      resultsDiv.innerHTML = `<p style="color: var(--text-muted); font-size: 15px;">Recherche en cours...</p>`;

      try {
        const searchUrl = `https://www.marmiton.org/recettes/recherche.aspx?aqt=${encodeURIComponent(q)}`;
        const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(searchUrl)}`);
        if (!res.ok) throw new Error("Connexion impossible");

        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, "text/html");

        const links = Array.from(doc.querySelectorAll('a[href*="/recettes/recette_"]'));
        const recipes = [];
        const seenUrls = new Set();

        for (const a of links) {
          let href = a.getAttribute("href");
          if (!href.startsWith("http")) href = `https://www.marmiton.org${href}`;
          if (seenUrls.has(href)) continue;

          const card = a.closest("div") || a;
          const title = a.querySelector("h4")?.textContent?.trim() || a.getAttribute("title") || a.textContent?.trim();
          if (!title || title.length < 4) continue;
          seenUrls.add(href);

          const cardText = card.textContent || "";
          const timeMatch = cardText.match(/(\d+\s*(?:h|min|mn))/i);
          const diffMatch = cardText.match(/(très facile|facile|moyen|difficile)/i);

          recipes.push({
            title: title.replace(/\s+/g, ' ').substring(0, 65),
            url: href,
            time: timeMatch ? timeMatch[0] : "30 min",
            diff: diffMatch ? diffMatch[0] : "Facile"
          });

          if (recipes.length >= 3) break;
        }

        if (recipes.length === 0) {
          resultsDiv.innerHTML = `<p style="color: var(--text-muted);">Aucune recette trouvée.</p>`;
          return;
        }

        resultsDiv.innerHTML = `<h3>Suggestions</h3>` + recipes.map(r => `
          <div class="result-card" onclick="ouvrirRecette('${encodeURIComponent(r.url)}')">
            <div>
              <div class="result-title">${r.title}</div>
              <div class="meta-tag">${r.time} • ${r.diff}</div>
            </div>
            <div style="font-size: 18px; color: var(--text-muted);">→</div>
          </div>
        `).join("");

      } catch (err) {
        resultsDiv.innerHTML = `<p style="color: #e05252;">Erreur : ${err.message}</p>`;
      }
    }

    async function ouvrirRecette(encodedUrl) {
      const url = decodeURIComponent(encodedUrl);
      const nbPers = parseInt(document.getElementById("nbPersonnes").value) || 2;
      const searchView = document.getElementById("searchView");
      const recipeView = document.getElementById("recipeView");
      const recipeContent = document.getElementById("recipeContent");

      searchView.style.display = "none";
      recipeView.style.display = "block";
      window.scrollTo(0, 0);
      recipeContent.innerHTML = `<p style="color: var(--text-muted); font-size: 15px; margin-top: 20px;">Préparation de la fiche...</p>`;

      try {
        const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, "text/html");

        const scripts = doc.querySelectorAll('script[type="application/ld+json"]');
        let recipe = null;

        scripts.forEach(s => {
          try {
            const json = JSON.parse(s.textContent);
            if (json["@type"] === "Recipe") recipe = json;
            if (Array.isArray(json)) recipe = json.find(i => i["@type"] === "Recipe") || recipe;
            if (json["@graph"] && Array.isArray(json["@graph"])) {
              recipe = json["@graph"].find(i => i["@type"] === "Recipe") || recipe;
            }
          } catch (e) {}
        });

        if (!recipe) throw new Error("Fiche introuvable");

        const baseYield = parseInt(recipe.recipeYield) || 4;
        const ratio = nbPers / baseYield;

        // Ingrédients
        const ingredients = (recipe.recipeIngredient || []).map(raw => {
          const lower = raw.toLowerCase();
          let icon = null;
          for (const [k, f] of Object.entries(ASSETS.ingredients)) {
            if (matchIngredientStrict(lower, k)) {
              icon = f;
              break;
            }
          }
          const scaled = raw.replace(/(\d+([\.,]\d+)?)/g, m => {
            const v = parseFloat(m.replace(',', '.'));
            return (Math.round(v * ratio * 10) / 10).toString().replace('.', ',');
          });
          return { text: scaled, icon };
        });

        // Étapes
        let rawSteps = [];
        if (Array.isArray(recipe.recipeInstructions)) rawSteps = recipe.recipeInstructions;
        else if (recipe.recipeInstructions) rawSteps = [recipe.recipeInstructions];

        const steps = rawSteps.map((s, idx) => {
          const text = (typeof s === "string" ? s : (s.text || "")).trim();
          const lower = text.toLowerCase();

          // Animation
          let anim = null;
          for (const [k, f] of Object.entries(ASSETS.actions)) {
            if (lower.includes(k)) { anim = f; break; }
          }

          // Sprites
          const stepSprites = [];
          for (const [k, f] of Object.entries(ASSETS.ingredients)) {
            if (matchIngredientStrict(lower, k) && !stepSprites.includes(f)) {
              stepSprites.push(f);
            }
          }

          return { index: idx + 1, text, anim, stepSprites };
        });

        // Rendu final
        recipeContent.innerHTML = `
          <div class="recipe-header">
            <div class="recipe-title">${recipe.name}</div>
            <div class="recipe-sub">Dosé pour ${nbPers} personnes</div>
          </div>

          <h3>Ingrédients</h3>
          <div class="ingredients-grid">
            ${ingredients.map(ing => `
              <div class="ingredient-card">
                ${ing.icon 
                  ? `<img src="assets/${ing.icon}" class="ingredient-icon" alt="">` 
                  : `<div style="height: 44px; display:flex; align-items:center; color: var(--text-muted); font-size: 20px;">•</div>`}
                <div class="ingredient-text">${ing.text}</div>
              </div>
            `).join("")}
          </div>

          <h3>Préparation</h3>
          ${steps.map(step => `
            <div class="step-card">
              <div class="step-index">Étape ${step.index}</div>
              
              ${step.anim ? `
                <div class="step-media">
                  <dotlottie-player 
                    src="assets/${step.anim}" 
                    background="transparent" 
                    speed="1" 
                    style="width: 140px; height: 140px;" 
                    loop 
                    autoplay>
                  </dotlottie-player>
                </div>
              ` : ''}

              <div class="step-text">${step.text}</div>

              ${step.stepSprites.length > 0 ? `
                <div class="step-sprites">
                  ${step.stepSprites.map(spr => `<img src="assets/${spr}" class="step-sprite-icon" alt="">`).join("")}
                </div>
              ` : ''}
            </div>
          `).join("")}
        `;

      } catch (err) {
        recipeContent.innerHTML = `<p style="color: #e05252;">Erreur : ${err.message}</p>`;
      }
    }

    function retourRecherche() {
      document.getElementById("recipeView").style.display = "none";
      document.getElementById("searchView").style.display = "block";
      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
