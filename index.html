<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cuisine Assist</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Lecteur Lottie pour  animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dotlottie-player/2.7.12/dotlottie-player.mjs" type="module"></script>

  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      margin: 0; 
      padding: 16px; 
      background: #0f172a; 
      color: #f8fafc; 
      min-height: 100vh;
    }
    h1, h2, h3 { margin-top: 0; }
    input, button { 
      padding: 12px 14px; 
      font-size: 16px; 
      border-radius: 10px; 
      border: 1px solid #334155; 
      background: #1e293b; 
      color: white; 
    }
    button { 
      background: #0284c7; 
      border: none; 
      font-weight: 600; 
      cursor: pointer; 
    }
    button:active { opacity: 0.8; }
    .card { 
      background: #1e293b; 
      border: 1px solid #334155; 
      border-radius: 12px; 
      padding: 16px; 
      margin-bottom: 16px; 
    }
    .badge { 
      display: inline-block; 
      background: #0369a1; 
      color: #e0f2fe; 
      padding: 4px 10px; 
      border-radius: 6px; 
      font-size: 13px; 
      font-weight: 500; 
      margin-right: 6px; 
      margin-bottom: 6px;
    }
    .badge-diff { background: #334155; color: #cbd5e1; }
    
    /* Grille de résultats de recherche */
    .result-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .result-item:active { border-color: #38bdf8; background: #243248; }
    .result-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }

    /* Lignes d'ingrédients */
    .ingredient-item { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      padding: 8px 0; 
      border-bottom: 1px solid #334155; 
      font-size: 16px; 
    }
    .ingredient-icon { width: 34px; height: 34px; object-fit: contain; flex-shrink: 0; }
    .bullet { width: 34px; text-align: center; color: #94a3b8; font-size: 20px; }

    /* Étapes et animations */
    .step-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .step-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .step-title { font-size: 17px; font-weight: bold; color: #38bdf8; }
    .step-body { font-size: 16px; line-height: 1.5; margin-bottom: 12px; }
    .step-animation { display: flex; justify-content: center; margin: 10px 0; }
    .step-sprites { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    
    .btn-secondary { background: #334155; color: white; width: 100%; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- ÉCRAN 1 : RECHERCHE -->
  <div id="searchView">
    <h2>Recherche Recette</h2>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <input type="text" id="queryInput" placeholder="Ex: tarte au poireau, curry...">
      <div style="display: flex; gap: 10px; align-items: center;">
        <label style="font-size: 14px; color: #94a3b8;">Convives :</label>
        <input type="number" id="nbPersonnes" value="2" style="width: 70px; text-align: center;">
        <button onclick="chercherRecettes()" style="flex-grow: 1;">Rechercher</button>
      </div>
    </div>

    <div id="searchResults" style="margin-top: 20px;"></div>
  </div>

  <!-- ÉCRAN 2 : VUE DÉTAILLÉE DE LA RECETTE -->
  <div id="recipeView" style="display: none;">
    <button onclick="retourRecherche()" class="btn-secondary" style="margin-bottom: 16px;">← Retour à la recherche</button>
    <div id="recipeContent"></div>
  </div>

  <script>
    // 1. Dictionnaire d'assets (exactement selon tes fichiers dans /assets)
    const ASSETS = {
      ingredients: {
        "ail": "ail.png",
        "amande": "amande.png",
        "aubergine": "aubergine.png",
        "banane": "banane.png",
        "citron": "citron.png",
        "citrouille": "citrouille.png",
        "eau": "eau.png",
        "farine": "farine.png",
        "fraise": "fraise.png",
        "raisin": "grain-de-raisin.png",
        "huile": "huile-olive.png",
        "kiwi": "kiwi.png",
        "lait": "lait.png",
        "oignon": "oignon.png",
        "orange": "orange.png",
        "pasteque": "pasteque.png",
        "poireau": "poireau.png",
        "pomme": "pomme.png"
      },
      actions: {
        "couper": "découper.json",
        "émincer": "découper.json",
        "hacher": "découper.json",
        "peler": "découper.json",
        "découper": "découper.json",
        "cuire": "poele.json",
        "revenir": "poele.json",
        "dorer": "poele.json",
        "poêler": "poele.json",
        "chauffer": "poele.json",
        "mélanger": "touillage.json",
        "remuer": "touillage.json",
        "fouetter": "touillage.json",
        "incorporer": "touillage.json",
        "battre": "touillage.json"
      }
    };

    // 2. Recherche sur Marmiton via corsproxy.io
    async function chercherRecettes() {
      const q = document.getElementById("queryInput").value.trim();
      const resultsDiv = document.getElementById("searchResults");
      if (!q) return;

      resultsDiv.innerHTML = "<p>🔍 Recherche des meilleures recettes...</p>";

      try {
        const searchUrl = `https://www.marmiton.org/recettes/recherche.aspx?aqt=${encodeURIComponent(q)}`;
        const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(searchUrl)}`);
        if (!res.ok) throw new Error("Erreur de connexion au proxy");

        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, "text/html");

        // Extraction des cartes de recettes
        const links = Array.from(doc.querySelectorAll('a[href*="/recettes/recette_"]'));
        const recipes = [];
        const seenUrls = new Set();

        for (const a of links) {
          let href = a.getAttribute("href");
          if (!href.startsWith("http")) href = `https://www.marmiton.org${href}`;
          if (seenUrls.has(href)) continue;

          // Recherche du titre et des badges texte
          const card = a.closest("div") || a;
          const title = a.querySelector("h4")?.textContent?.trim() || a.getAttribute("title") || a.textContent?.trim();
          
          if (!title || title.length < 4) continue;
          seenUrls.add(href);

          const cardText = card.textContent || "";
          const timeMatch = cardText.match(/(\d+\s*(?:h|min|mn))/i);
          const diffMatch = cardText.match(/(très facile|facile|moyen|difficile)/i);

          recipes.push({
            title: title.replace(/\s+/g, ' ').substring(0, 75),
            url: href,
            time: timeMatch ? timeMatch[0] : "30 min",
            diff: diffMatch ? diffMatch[0] : "Facile"
          });

          if (recipes.length >= 3) break; // On limite à 3 résultats
        }

        if (recipes.length === 0) {
          resultsDiv.innerHTML = "<p>Aucune recette trouvée pour cette recherche.</p>";
          return;
        }

        // Rendu des 3 résultats
        resultsDiv.innerHTML = `<h3>Choisis une recette :</h3>` + recipes.map((r, i) => `
          <div class="result-item" onclick="ouvrirRecette('${encodeURIComponent(r.url)}')">
            <div class="result-title">${r.title}</div>
            <div>
              <span class="badge">⏱ ${r.time}</span>
              <span class="badge badge-diff">★ ${r.diff}</span>
            </div>
          </div>
        `).join("");

      } catch (err) {
        resultsDiv.innerHTML = `<p style="color: #f87171;">Erreur : ${err.message}</p>`;
      }
    }

    // 3. Récupération et parsing de la recette sélectionnée
    async function ouvrirRecette(encodedUrl) {
      const url = decodeURIComponent(encodedUrl);
      const nbPers = parseInt(document.getElementById("nbPersonnes").value) || 2;
      const searchView = document.getElementById("searchView");
      const recipeView = document.getElementById("recipeView");
      const recipeContent = document.getElementById("recipeContent");

      searchView.style.display = "none";
      recipeView.style.display = "block";
      recipeContent.innerHTML = "<p>⏳ Préparation de la fiche recette...</p>";

      try {
        const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, "text/html");

        const scripts = doc.querySelectorAll('script[type="application/ld+json"]');
        let recipe = null;

        scripts.forEach(s => {
          try {
            const json = JSON.parse(s.textContent);
            if (json["@type"] === "Recipe") recipe = json;
            if (Array.isArray(json)) recipe = json.find(i => i["@type"] === "Recipe") || recipe;
            if (json["@graph"] && Array.isArray(json["@graph"])) {
              recipe = json["@graph"].find(i => i["@type"] === "Recipe") || recipe;
            }
          } catch (e) {}
        });

        if (!recipe) throw new Error("Données de recette introuvables.");

        const baseYield = parseInt(recipe.recipeYield) || 4;
        const ratio = nbPers / baseYield;

        // Recalcul des ingrédients + matching sprite
        const ingredients = (recipe.recipeIngredient || []).map(raw => {
          const lower = raw.toLowerCase();
          let icon = null;
          for (const [k, f] of Object.entries(ASSETS.ingredients)) {
            if (lower.includes(k)) { icon = f; break; }
          }
          const scaled = raw.replace(/(\d+([\.,]\d+)?)/g, m => {
            const v = parseFloat(m.replace(',', '.'));
            return (Math.round(v * ratio * 10) / 10).toString().replace('.', ',');
          });
          return { text: scaled, icon };
        });

        // Étapes + matching animation & sprites cités
        let rawSteps = [];
        if (Array.isArray(recipe.recipeInstructions)) rawSteps = recipe.recipeInstructions;
        else if (recipe.recipeInstructions) rawSteps = [recipe.recipeInstructions];

        const steps = rawSteps.map((s, idx) => {
          const text = (typeof s === "string" ? s : (s.text || "")).trim();
          const lower = text.toLowerCase();

          // Animation action
          let anim = null;
          for (const [k, f] of Object.entries(ASSETS.actions)) {
            if (lower.includes(k)) { anim = f; break; }
          }

          // Sprites concernés par l'étape
          const stepSprites = [];
          for (const [k, f] of Object.entries(ASSETS.ingredients)) {
            if (lower.includes(k) && !stepSprites.includes(f)) {
              stepSprites.push(f);
            }
          }

          return { index: idx + 1, text, anim, stepSprites };
        });

        // 4. Rendu visuel de la fiche recette
        recipeContent.innerHTML = `
          <div class="card">
            <h2>${recipe.name}</h2>
            <div>
              <span class="badge">Pour ${nbPers} personnes</span>
              <span class="badge badge-diff">Base : ${baseYield} pers.</span>
            </div>
          </div>

          <div class="card">
            <h3>Ingrédients (${ingredients.length})</h3>
            ${ingredients.map(ing => `
              <div class="ingredient-item">
                ${ing.icon 
                  ? `<img src="assets/${ing.icon}" class="ingredient-icon" alt="">` 
                  : `<span class="bullet">•</span>`}
                <div>${ing.text}</div>
              </div>
            `).join("")}
          </div>

          <h3>Préparation étape par étape</h3>
          ${steps.map(step => `
            <div class="step-card">
              <div class="step-header">
                <span class="step-title">Étape ${step.index}</span>
              </div>
              <div class="step-body">${step.text}</div>
              
              ${step.anim ? `
                <div class="step-animation">
                  <dotlottie-player 
                    src="assets/${step.anim}" 
                    background="transparent" 
                    speed="1" 
                    style="width: 120px; height: 120px;" 
                    loop 
                    autoplay>
                  </dotlottie-player>
                </div>
              ` : ''}

              ${step.stepSprites.length > 0 ? `
                <div class="step-sprites">
                  ${step.stepSprites.map(spr => `<img src="assets/${spr}" class="ingredient-icon" title="Ingrédient">`).join("")}
                </div>
              ` : ''}
            </div>
          `).join("")}
        `;

      } catch (err) {
        recipeContent.innerHTML = `<p style="color: #f87171;">Erreur lors du chargement : ${err.message}</p>`;
      }
    }

    function retourRecherche() {
      document.getElementById("recipeView").style.display = "none";
      document.getElementById("searchView").style.display = "block";
    }
  </script>
</body>
</html>
