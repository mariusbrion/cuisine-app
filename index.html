<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Parsing Recette</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 15px; background: #0f172a; color: #f8fafc; }
    input, button { width: 100%; padding: 12px; margin: 6px 0; font-size: 15px; border-radius: 8px; box-sizing: border-box; }
    input { background: #1e293b; border: 1px solid #334155; color: white; }
    button { background: #2563eb; color: white; border: none; font-weight: bold; cursor: pointer; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-top: 12px; }
    .tag { display: inline-block; background: #0284c7; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-right: 5px; }
    ul, ol { padding-left: 20px; }
    li { margin-bottom: 8px; line-height: 1.4; }
  </style>
</head>
<body>

  <h3>Test Extraction Recette</h3>

  <input type="text" id="targetUrl" value="https://www.marmiton.org/recettes/recette_fondue-de-poireaux_17316.aspx">
  
  <div style="display: flex; gap: 10px;">
    <input type="number" id="nbPersonnes" value="2" style="width: 80px;" placeholder="Pers.">
    <button onclick="extraireRecette()">Tester le parsing</button>
  </div>

  <div id="output"></div>

  <script>
    const output = document.getElementById("output");

    async function extraireRecette() {
      const url = document.getElementById("targetUrl").value.trim();
      const nbPers = parseInt(document.getElementById("nbPersonnes").value) || 2;
      output.innerHTML = "<p>⏳ Récupération et analyse...</p>";

      try {
        // 1. Appel du proxy validé
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
        const res = await fetch(proxyUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const html = await res.text();

        // 2. P
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");
        const scripts = doc.querySelectorAll('script[type="application/ld+json"]');

        let recipe = null;

        scripts.forEach(s => {
          try {
            const json = JSON.parse(s.textContent);
            if (json["@type"] === "Recipe") recipe = json;
            if (Array.isArray(json)) recipe = json.find(i => i["@type"] === "Recipe") || recipe;
            if (json["@graph"] && Array.isArray(json["@graph"])) {
              recipe = json["@graph"].find(i => i["@type"] === "Recipe") || recipe;
            }
          } catch (e) {}
        });

        if (!recipe) throw new Error("Balise Schema.org Recipe introuvable dans la page.");

        // 3. Calcul des ratios
        const baseYield = parseInt(recipe.recipeYield) || 4;
        const ratio = nbPers / baseYield;

        // Ingrédients recalculés
        const ingredients = (recipe.recipeIngredient || []).map(ing => {
          return ing.replace(/(\d+([\.,]\d+)?)/g, m => {
            const v = parseFloat(m.replace(',', '.'));
            return (Math.round(v * ratio * 10) / 10).toString().replace('.', ',');
          });
        });

        // Étapes
        let steps = [];
        if (Array.isArray(recipe.recipeInstructions)) {
          steps = recipe.recipeInstructions.map(s => typeof s === "string" ? s : (s.text || ""));
        } else if (typeof recipe.recipeInstructions === "string") {
          steps = [recipe.recipeInstructions];
        }

        // 4. Rendu visuel propr
        output.innerHTML = `
          <div class="card">
            <h2>${recipe.name}</h2>
            <p><span class="tag">Base : ${baseYield} pers.</span> <span class="tag">Calculé pour : ${nbPers} pers.</span></p>
            
            <h3>Ingrédients (${ingredients.length}) :</h3>
            <ul>
              ${ingredients.map(ing => `<li>${ing}</li>`).join("")}
            </ul>

            <h3>Étapes (${steps.length}) :</h3>
            <ol>
              ${steps.map(step => `<li>${step}</li>`).join("")}
            </ol>
          </div>
        `;

      } catch (err) {
        output.innerHTML = `<div class="card" style="border-color: #ef4444; color: #f87171;"><strong>Erreur :</strong> ${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
